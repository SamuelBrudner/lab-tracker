[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lab-tracker"
version = "0.1.0"
description = "Lab tracker project"
requires-python = ">=3.10"
dependencies = [
  "alembic",
  "fastapi",
  "httpx>=0.27.1",
  "mcp>=1.27,<2",
  "psycopg[binary]>=3.1",
  "pydantic-settings",
  "python-multipart",
  "segno>=1.6",
  "sqlalchemy>=2.0",
  "uvicorn",
]

[project.optional-dependencies]
test = [
  "pytest",
  "pytest-cov",
  "pytest-xdist",
]
lint = [
  "ruff",
]
figure = [
  "matplotlib",
  "pillow",
]

[project.scripts]
lab-tracker = "lab_tracker.cli:main"
lab_tracker = "lab_tracker.cli:main"
lt = "lab_tracker_client.cli:main"
lt-mcp = "lab_tracker.mcp_server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["lab_tracker", "lab_tracker.*", "lab_tracker_client", "lab_tracker_client.*"]

[tool.setuptools.package-data]
lab_tracker = [
  "alembic/env.py",
  "alembic/versions/*.py",
  "frontend/*",
  "frontend/**/*",
]

[tool.setuptools.data-files]
"share/lab-tracker/skills/lab-tracker" = ["skills/lab-tracker/SKILL.md"]

[tool.codex_orchestrator]
env = "lab_tracker"
allow_env_creation = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# -n auto parallelises across CPU cores (pytest-xdist); tests use isolated
# per-test in-memory/tmp databases, so parallel workers do not collide.
# Measured on 4 cores: full suite ~11min -> ~3min. Override with `-n0` to
# force serial (e.g. for pdb/debugging a single test).
addopts = ["--cov=lab_tracker", "-n", "auto"]
markers = [
  "postgres: requires LAB_TRACKER_POSTGRES_TEST_DATABASE_URL and a reachable Postgres server",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["src/lab_tracker/alembic", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
