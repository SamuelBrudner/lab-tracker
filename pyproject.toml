[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lab-tracker"
version = "0.1.0"
description = "Human-gated research provenance for questions, evidence, analyses, claims, and figures"
readme = "README.md"
requires-python = ">=3.10"
keywords = [
  "research provenance",
  "scientific workflows",
  "research data",
  "knowledge graph",
  "human-in-the-loop",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Framework :: FastAPI",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "alembic",
  "dnspython>=2.7",
  "fastapi",
  "httpx>=0.27.1",
  "idna>=3.7,<4",
  "mcp>=1.27,<2",
  "psycopg[binary]>=3.1",
  "pydantic-settings",
  "python-multipart",
  "segno>=1.6",
  "sqlalchemy>=2.0",
  "uvicorn",
]

[project.urls]
Homepage = "https://github.com/SamuelBrudner/lab-tracker"
Demo = "https://samuelbrudner.github.io/lab-tracker/app/"
Documentation = "https://github.com/SamuelBrudner/lab-tracker/tree/main/docs"
Issues = "https://github.com/SamuelBrudner/lab-tracker/issues"

[project.optional-dependencies]
test = [
  "pytest",
  "pytest-cov",
  "pytest-xdist",
  "pyld",
  "tomli; python_version < '3.11'",
]
lint = [
  "mypy>=1.15,<2",
  "ruff",
]
figure = [
  "matplotlib",
  "pillow",
]

[project.scripts]
lab-tracker = "lab_tracker.cli:main"
lab_tracker = "lab_tracker.cli:main"
lt = "lab_tracker_client.cli:main"
lt-mcp = "lab_tracker.mcp_server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["lab_tracker", "lab_tracker.*", "lab_tracker_client", "lab_tracker_client.*"]

[tool.setuptools.package-data]
lab_tracker = [
  "alembic/env.py",
  "alembic/versions/*.py",
  "frontend/*",
  "frontend/**/*",
]

[tool.codex_orchestrator]
env = "lab_tracker"
allow_env_creation = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# -n auto parallelises across CPU cores (pytest-xdist); tests use isolated
# per-test in-memory/tmp databases, so parallel workers do not collide.
# Measured on 4 cores: full suite ~11min -> ~3min. Override with `-n0` to
# force serial (e.g. for pdb/debugging a single test).
addopts = ["--cov=lab_tracker", "-n", "auto"]
markers = [
  "postgres: requires LAB_TRACKER_POSTGRES_TEST_DATABASE_URL and a reachable Postgres server",
]
filterwarnings = [
  # Fail on an unclosed database connection: SQLite emits a ResourceWarning when
  # a connection is finalized without being closed, so a test that leaks an
  # engine/session (the class of leak the test fixtures were fixed for) turns
  # into an error instead of quiet warning noise. pytest surfaces it through its
  # unraisable-exception hook at the owning test's teardown.
  "error::ResourceWarning",
  # FastAPI's TestClient re-exports starlette.testclient, which warns that using
  # httpx (rather than httpx2) is deprecated — a third-party transition Lab
  # Tracker does not drive. Scoped to this exact message only.
  "ignore:Using .httpx. with .starlette.testclient. is deprecated",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["src/lab_tracker/alembic", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.10"
strict = true
follow_imports = "silent"
warn_unused_configs = true
show_error_codes = true
files = [
  "src/lab_tracker/patching.py",
  "src/lab_tracker/repository.py",
  "src/lab_tracker/decision_context_types.py",
  "src/lab_tracker/decision_context_query.py",
  "src/lab_tracker/decision_context_use_case.py",
  "src/lab_tracker/project_graph.py",
  "src/lab_tracker/provider_error_redaction.py",
  "src/lab_tracker/outbound_http.py",
  "src/lab_tracker/http_store_health.py",
  "src/lab_tracker/local_filesystem_authority.py",
  "src/lab_tracker/store_authority_registry.py",
  "src/lab_tracker/local_filesystem_operations.py",
  "src/lab_tracker/local_filesystem_ports.py",
