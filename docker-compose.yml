services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LAB_TRACKER_APP_NAME: ${LAB_TRACKER_APP_NAME:-lab-tracker}
      LAB_TRACKER_ENVIRONMENT: ${LAB_TRACKER_ENVIRONMENT:-production}
      LAB_TRACKER_LOG_LEVEL: ${LAB_TRACKER_LOG_LEVEL:-INFO}
      LAB_TRACKER_DATABASE_URL: ${LAB_TRACKER_DATABASE_URL:-postgresql+psycopg://lab_tracker:lab_tracker@postgres:5432/lab_tracker}
      LAB_TRACKER_FILE_STORAGE_PATH: ${LAB_TRACKER_FILE_STORAGE_PATH:-/app/data/file_storage}
      LAB_TRACKER_NOTE_STORAGE_PATH: ${LAB_TRACKER_NOTE_STORAGE_PATH:-/app/data/note_storage}
      LAB_TRACKER_AUTH_SECRET_KEY: ${LAB_TRACKER_AUTH_SECRET_KEY:-}
      LAB_TRACKER_AUTH_TOKEN_TTL_MINUTES: ${LAB_TRACKER_AUTH_TOKEN_TTL_MINUTES:-720}
      LAB_TRACKER_BOOTSTRAP_ADMIN_TOKEN: ${LAB_TRACKER_BOOTSTRAP_ADMIN_TOKEN:-}
      LAB_TRACKER_RESOLVER_HTTP_ALLOWED_AUTHORITIES: ${LAB_TRACKER_RESOLVER_HTTP_ALLOWED_AUTHORITIES:-}
      LAB_TRACKER_RESOLVER_HTTP_ALLOWED_NETWORKS: ${LAB_TRACKER_RESOLVER_HTTP_ALLOWED_NETWORKS:-}
      LAB_TRACKER_GIT_ALLOWED_REMOTES: ${LAB_TRACKER_GIT_ALLOWED_REMOTES:-}
      LAB_TRACKER_RESOLVER_HTTP_DEADLINE_SECONDS: ${LAB_TRACKER_RESOLVER_HTTP_DEADLINE_SECONDS:-30}
      LAB_TRACKER_RESOLVER_SUBPROCESS_DEADLINE_SECONDS: ${LAB_TRACKER_RESOLVER_SUBPROCESS_DEADLINE_SECONDS:-30}
      LAB_TRACKER_ARTIFACT_RESOLUTION_GLOBAL_IN_FLIGHT_LIMIT: ${LAB_TRACKER_ARTIFACT_RESOLUTION_GLOBAL_IN_FLIGHT_LIMIT:-8}
      LAB_TRACKER_ARTIFACT_RESOLUTION_PER_ACTOR_IN_FLIGHT_LIMIT: ${LAB_TRACKER_ARTIFACT_RESOLUTION_PER_ACTOR_IN_FLIGHT_LIMIT:-2}
    ports:
      - "8000:8000"
    volumes:
      - app_data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  mcp:
    build:
      context: .
      dockerfile: Dockerfile
    command: uv run python -m lab_tracker.mcp_server
    depends_on:
      app:
        condition: service_healthy
    environment:
      LAB_TRACKER_MCP_TRANSPORT: streamable-http
      # Docker needs the process reachable on the container interface; the
      # published host port below is still loopback-only.
      LAB_TRACKER_MCP_HOST: ${LAB_TRACKER_MCP_HOST:-0.0.0.0}
      LAB_TRACKER_MCP_PORT: ${LAB_TRACKER_MCP_PORT:-8000}
      LAB_TRACKER_MCP_PATH: ${LAB_TRACKER_MCP_PATH:-/mcp}
      LAB_TRACKER_MCP_BASE_URL: ${LAB_TRACKER_MCP_BASE_URL:-http://app:8000}
      LAB_TRACKER_MCP_API_KEY: ${LT_MCP_READONLY_TOKEN:?Set LT_MCP_READONLY_TOKEN to a read-only lpat_ token}
    ports:
      - "127.0.0.1:${LAB_TRACKER_MCP_HOST_PORT:-9000}:${LAB_TRACKER_MCP_PORT:-8000}"
    restart: unless-stopped

  # One-shot control plane for a mailbox-owned automation. This profile is off
  # by default and receives neither mailbox nor model-provider credentials.
  # Set LAB_TRACKER_PUBLIC_BASE_URL and provision the runtime signing-secret
  # file before invoking the profile.
  review-email-control:
    profiles:
      - review-email-external
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LAB_TRACKER_ENVIRONMENT: ${LAB_TRACKER_ENVIRONMENT:-production}
      LAB_TRACKER_DATABASE_URL: ${LAB_TRACKER_DATABASE_URL:-postgresql+psycopg://lab_tracker:lab_tracker@postgres:5432/lab_tracker}
      LAB_TRACKER_AUTH_SECRET_KEY_FILE: /app/data/runtime-env/auth-secret-key
      LAB_TRACKER_PUBLIC_BASE_URL: ${LAB_TRACKER_PUBLIC_BASE_URL:-}
      LAB_TRACKER_REVIEW_EMAIL_ENABLED: "true"
      LAB_TRACKER_REVIEW_EMAIL_TRANSPORT: external
      LAB_TRACKER_REVIEW_EMAIL_CLAIM_LEASE_SECONDS: ${LAB_TRACKER_REVIEW_EMAIL_CLAIM_LEASE_SECONDS:-300}
      LAB_TRACKER_REVIEW_EMAIL_MAX_ATTEMPTS: ${LAB_TRACKER_REVIEW_EMAIL_MAX_ATTEMPTS:-8}
      LAB_TRACKER_REVIEW_EMAIL_LINK_TTL_MINUTES: ${LAB_TRACKER_REVIEW_EMAIL_LINK_TTL_MINUTES:-1440}
    entrypoint:
      - python
      - -m
      - lab_tracker.review_email_external_worker
    command:
      - --help
    volumes:
      - app_data:/app/data:ro
    restart: "no"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lab_tracker}
      POSTGRES_USER: ${POSTGRES_USER:-lab_tracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lab_tracker}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-lab_tracker} -d ${POSTGRES_DB:-lab_tracker}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  app_data:
  postgres_data:
