services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LAB_TRACKER_APP_NAME: ${LAB_TRACKER_APP_NAME:-lab-tracker}
      LAB_TRACKER_ENVIRONMENT: ${LAB_TRACKER_ENVIRONMENT:-production}
      LAB_TRACKER_LOG_LEVEL: ${LAB_TRACKER_LOG_LEVEL:-INFO}
      LAB_TRACKER_DATABASE_URL: ${LAB_TRACKER_DATABASE_URL:-postgresql+psycopg://lab_tracker:lab_tracker@postgres:5432/lab_tracker}
      LAB_TRACKER_FILE_STORAGE_PATH: ${LAB_TRACKER_FILE_STORAGE_PATH:-/app/data/file_storage}
      LAB_TRACKER_NOTE_STORAGE_PATH: ${LAB_TRACKER_NOTE_STORAGE_PATH:-/app/data/note_storage}
      LAB_TRACKER_AUTH_SECRET_KEY: ${LAB_TRACKER_AUTH_SECRET_KEY:-}
      LAB_TRACKER_AUTH_TOKEN_TTL_MINUTES: ${LAB_TRACKER_AUTH_TOKEN_TTL_MINUTES:-720}
      LAB_TRACKER_BOOTSTRAP_ADMIN_TOKEN: ${LAB_TRACKER_BOOTSTRAP_ADMIN_TOKEN:-}
    ports:
      - "8000:8000"
    volumes:
      - app_data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  mcp:
    build:
      context: .
      dockerfile: Dockerfile
    command: uv run python -m lab_tracker.mcp_server
    depends_on:
      app:
        condition: service_healthy
    environment:
      LAB_TRACKER_MCP_TRANSPORT: streamable-http
      # Docker needs the process reachable on the container interface; the
      # published host port below is still loopback-only.
      LAB_TRACKER_MCP_HOST: ${LAB_TRACKER_MCP_HOST:-0.0.0.0}
      LAB_TRACKER_MCP_PORT: ${LAB_TRACKER_MCP_PORT:-8000}
      LAB_TRACKER_MCP_PATH: ${LAB_TRACKER_MCP_PATH:-/mcp}
      LAB_TRACKER_MCP_BASE_URL: ${LAB_TRACKER_MCP_BASE_URL:-http://app:8000}
      LAB_TRACKER_MCP_API_KEY: ${LT_MCP_READONLY_TOKEN:?Set LT_MCP_READONLY_TOKEN to a read-only lpat_ token}
    ports:
      - "127.0.0.1:${LAB_TRACKER_MCP_HOST_PORT:-9000}:${LAB_TRACKER_MCP_PORT:-8000}"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lab_tracker}
      POSTGRES_USER: ${POSTGRES_USER:-lab_tracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lab_tracker}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-lab_tracker} -d ${POSTGRES_DB:-lab_tracker}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  app_data:
  postgres_data:
