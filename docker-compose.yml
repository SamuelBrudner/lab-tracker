services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LAB_TRACKER_APP_NAME: ${LAB_TRACKER_APP_NAME:-lab-tracker}
      LAB_TRACKER_ENVIRONMENT: ${LAB_TRACKER_ENVIRONMENT:-production}
      LAB_TRACKER_LOG_LEVEL: ${LAB_TRACKER_LOG_LEVEL:-INFO}
      LAB_TRACKER_BASE_URL: ${LAB_TRACKER_BASE_URL:-${LAB_TRACKER_PUBLIC_BASE_URL:-}}
      # Defaults to the postgres service's POSTGRES_* credentials so changing
      # them reaches the app too. The password is spliced into a URL: keep it
      # URL-safe, or set LAB_TRACKER_DATABASE_URL with it percent-encoded.
      LAB_TRACKER_DATABASE_URL: ${LAB_TRACKER_DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-lab_tracker}:${POSTGRES_PASSWORD:-lab_tracker}@postgres:5432/${POSTGRES_DB:-lab_tracker}}
      LAB_TRACKER_FILE_STORAGE_PATH: ${LAB_TRACKER_FILE_STORAGE_PATH:-/app/data/file_storage}
      LAB_TRACKER_NOTE_STORAGE_PATH: ${LAB_TRACKER_NOTE_STORAGE_PATH:-/app/data/note_storage}
      LAB_TRACKER_AUTH_SECRET_KEY: ${LAB_TRACKER_AUTH_SECRET_KEY:-}
      LAB_TRACKER_AUTH_TOKEN_TTL_MINUTES: ${LAB_TRACKER_AUTH_TOKEN_TTL_MINUTES:-720}
      LAB_TRACKER_BOOTSTRAP_ADMIN_TOKEN: ${LAB_TRACKER_BOOTSTRAP_ADMIN_TOKEN:-}
      LAB_TRACKER_STORE_AUTHORITY_GRANTS_JSON: ${LAB_TRACKER_STORE_AUTHORITY_GRANTS_JSON:-}
      LAB_TRACKER_RESOLVER_ALLOWED_ROOTS: ${LAB_TRACKER_RESOLVER_ALLOWED_ROOTS:-}
      LAB_TRACKER_RESOLVER_RECOVERY: ${LAB_TRACKER_RESOLVER_RECOVERY:-false}
      LAB_TRACKER_RESOLVER_RECOVERY_MAX_FILES: ${LAB_TRACKER_RESOLVER_RECOVERY_MAX_FILES:-4096}
      LAB_TRACKER_RESOLVER_RECOVERY_MAX_DIRECTORIES: ${LAB_TRACKER_RESOLVER_RECOVERY_MAX_DIRECTORIES:-4096}
      LAB_TRACKER_RESOLVER_RECOVERY_MAX_BYTES: ${LAB_TRACKER_RESOLVER_RECOVERY_MAX_BYTES:-536870912}
      LAB_TRACKER_RESOLVER_HTTP_ALLOWED_AUTHORITIES: ${LAB_TRACKER_RESOLVER_HTTP_ALLOWED_AUTHORITIES:-}
      LAB_TRACKER_RESOLVER_HTTP_ALLOWED_NETWORKS: ${LAB_TRACKER_RESOLVER_HTTP_ALLOWED_NETWORKS:-}
      LAB_TRACKER_RCLONE_ALLOWED_REMOTES: ${LAB_TRACKER_RCLONE_ALLOWED_REMOTES:-}
      LAB_TRACKER_GIT_ALLOWED_REMOTES: ${LAB_TRACKER_GIT_ALLOWED_REMOTES:-}
      LAB_TRACKER_RESOLVER_HTTP_DEADLINE_SECONDS: ${LAB_TRACKER_RESOLVER_HTTP_DEADLINE_SECONDS:-30}
      LAB_TRACKER_RESOLVER_SUBPROCESS_DEADLINE_SECONDS: ${LAB_TRACKER_RESOLVER_SUBPROCESS_DEADLINE_SECONDS:-30}
      LAB_TRACKER_ARTIFACT_RESOLUTION_GLOBAL_IN_FLIGHT_LIMIT: ${LAB_TRACKER_ARTIFACT_RESOLUTION_GLOBAL_IN_FLIGHT_LIMIT:-8}
      LAB_TRACKER_ARTIFACT_RESOLUTION_PER_ACTOR_IN_FLIGHT_LIMIT: ${LAB_TRACKER_ARTIFACT_RESOLUTION_PER_ACTOR_IN_FLIGHT_LIMIT:-2}
      LAB_TRACKER_STORE_HEALTH_GLOBAL_IN_FLIGHT_LIMIT: ${LAB_TRACKER_STORE_HEALTH_GLOBAL_IN_FLIGHT_LIMIT:-4}
      LAB_TRACKER_STORE_HEALTH_PER_ACTOR_IN_FLIGHT_LIMIT: ${LAB_TRACKER_STORE_HEALTH_PER_ACTOR_IN_FLIGHT_LIMIT:-1}
      LAB_TRACKER_STORE_HEALTH_CACHE_MAX_ENTRIES: ${LAB_TRACKER_STORE_HEALTH_CACHE_MAX_ENTRIES:-256}
      LAB_TRACKER_STORE_HEALTH_CACHE_TTL_SECONDS: ${LAB_TRACKER_STORE_HEALTH_CACHE_TTL_SECONDS:-10}
      LAB_TRACKER_STORE_HEALTH_SINGLEFLIGHT_WAIT_SECONDS: ${LAB_TRACKER_STORE_HEALTH_SINGLEFLIGHT_WAIT_SECONDS:-10}
      # uvicorn trusts X-Forwarded-For/-Proto only from these peers. Set it to
      # the reverse proxy's address as seen by this container; see
      # docs/self-hosted-operations.md.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    ports:
      - "8000:8000"
    volumes:
      - app_data:/app/data
    # uvicorn runs as the container's main process and never reaps orphaned
    # grandchildren of bounded subprocesses; Docker's init does.
    init: true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Optional hosted read-only MCP endpoint. It is behind the `mcp` profile so
  # app, postgres, backup, and restore commands never need MCP tokens; enable
  # it with `docker compose --profile mcp up -d mcp`. Compose interpolates the
  # whole file before selecting profiles, so the token requirement is enforced
  # by the entrypoint below when the service starts, not by `${VAR:?}`.
  mcp:
    profiles:
      - mcp
    build:
      context: .
      dockerfile: Dockerfile
    # Run the image's frozen virtualenv directly (PATH starts with
    # /app/.venv/bin). `uv run` would re-lock and reinstall the project at
    # container start, and the app entrypoint would run database migrations
    # this API client does not need.
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -z "$${LAB_TRACKER_MCP_INBOUND_TOKEN:-}" ]; then
          echo "Set LT_MCP_INBOUND_TOKEN to a distinct random bearer token before enabling the mcp profile." >&2
          exit 64
        fi
        if [ -z "$${LAB_TRACKER_MCP_API_KEY:-}" ]; then
          echo "Set LT_MCP_READONLY_TOKEN to a read-only lpat_ token before enabling the mcp profile." >&2
          exit 64
        fi
        exec python -m lab_tracker.mcp_server
    depends_on:
      app:
        condition: service_healthy
    environment:
      LAB_TRACKER_MCP_TRANSPORT: streamable-http
      # Docker needs the process reachable on the container interface; the
      # published host port below is still loopback-only. This is fixed rather
      # than interpolated because LAB_TRACKER_MCP_HOST in `.env` configures a
      # host-run `lt-mcp` and would otherwise bind the container's loopback.
      LAB_TRACKER_MCP_HOST: 0.0.0.0
      LAB_TRACKER_MCP_PORT: ${LAB_TRACKER_MCP_PORT:-8000}
      LAB_TRACKER_MCP_PATH: ${LAB_TRACKER_MCP_PATH:-/mcp}
      LAB_TRACKER_BASE_URL: ${LAB_TRACKER_MCP_BASE_URL:-http://app:8000}
      LAB_TRACKER_MCP_INBOUND_TOKEN: ${LT_MCP_INBOUND_TOKEN:-}
      LAB_TRACKER_MCP_API_KEY: ${LT_MCP_READONLY_TOKEN:-}
      # Hosted MCP serves read tools only unless writes are deliberately enabled.
      LAB_TRACKER_MCP_ALLOW_WRITES: ${LAB_TRACKER_MCP_ALLOW_WRITES:-false}
      # Optional Host/Origin allowlists (comma lists); empty leaves Host policy
      # to the reverse proxy in front of the loopback-published port.
      LAB_TRACKER_MCP_ALLOWED_HOSTS: ${LAB_TRACKER_MCP_ALLOWED_HOSTS:-}
      LAB_TRACKER_MCP_ALLOWED_ORIGINS: ${LAB_TRACKER_MCP_ALLOWED_ORIGINS:-}
    ports:
      - "127.0.0.1:${LAB_TRACKER_MCP_HOST_PORT:-9000}:${LAB_TRACKER_MCP_PORT:-8000}"
    init: true
    restart: unless-stopped
    # The image HEALTHCHECK probes the app's /health route; the MCP ASGI app
    # answers every unauthenticated request with 401, so probe the listener.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import os, socket; socket.create_connection(("127.0.0.1", int(os.environ.get("LAB_TRACKER_MCP_PORT", "8000"))), timeout=3).close()
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # One-shot control plane for a mailbox-owned automation. This profile is off
  # by default and receives neither mailbox nor model-provider credentials.
  # Set LAB_TRACKER_BASE_URL and provision the runtime signing-secret
  # file before invoking the profile.
  review-email-control:
    profiles:
      - review-email-external
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LAB_TRACKER_ENVIRONMENT: ${LAB_TRACKER_ENVIRONMENT:-production}
      LAB_TRACKER_DATABASE_URL: ${LAB_TRACKER_DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-lab_tracker}:${POSTGRES_PASSWORD:-lab_tracker}@postgres:5432/${POSTGRES_DB:-lab_tracker}}
      LAB_TRACKER_AUTH_SECRET_KEY_FILE: /app/data/runtime-env/auth-secret-key
      LAB_TRACKER_BASE_URL: ${LAB_TRACKER_BASE_URL:-${LAB_TRACKER_PUBLIC_BASE_URL:-}}
      LAB_TRACKER_REVIEW_EMAIL_ENABLED: "true"
      LAB_TRACKER_REVIEW_EMAIL_TRANSPORT: external
      LAB_TRACKER_REVIEW_EMAIL_CLAIM_LEASE_SECONDS: ${LAB_TRACKER_REVIEW_EMAIL_CLAIM_LEASE_SECONDS:-300}
      LAB_TRACKER_REVIEW_EMAIL_MAX_ATTEMPTS: ${LAB_TRACKER_REVIEW_EMAIL_MAX_ATTEMPTS:-8}
      LAB_TRACKER_REVIEW_EMAIL_LINK_TTL_MINUTES: ${LAB_TRACKER_REVIEW_EMAIL_LINK_TTL_MINUTES:-1440}
    entrypoint:
      - python
      - -m
      - lab_tracker.review_email_external_worker
    command:
      - --help
    volumes:
      - app_data:/app/data:ro
    restart: "no"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lab_tracker}
      POSTGRES_USER: ${POSTGRES_USER:-lab_tracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lab_tracker}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-lab_tracker} -d ${POSTGRES_DB:-lab_tracker}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  app_data:
  postgres_data:
