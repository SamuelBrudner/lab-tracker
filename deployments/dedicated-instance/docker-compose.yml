name: ${DEDICATED_COMPOSE_PROJECT_NAME:?Set DEDICATED_COMPOSE_PROJECT_NAME}

services:
  app:
    image: ${DEDICATED_IMAGE:?Set DEDICATED_IMAGE to a reviewed immutable image}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LAB_TRACKER_APP_NAME: ${DEDICATED_APP_NAME:?Set DEDICATED_APP_NAME}
      LAB_TRACKER_ENVIRONMENT: production
      LAB_TRACKER_DATABASE_URL: postgresql+psycopg://${DEDICATED_POSTGRES_USER:?Set DEDICATED_POSTGRES_USER}:${DEDICATED_POSTGRES_PASSWORD:?Set DEDICATED_POSTGRES_PASSWORD}@postgres:5432/${DEDICATED_POSTGRES_DB:?Set DEDICATED_POSTGRES_DB}
      LAB_TRACKER_FILE_STORAGE_PATH: /app/data/file_storage
      LAB_TRACKER_NOTE_STORAGE_PATH: /app/data/note_storage
      LAB_TRACKER_PUBLIC_BASE_URL: ${DEDICATED_PUBLIC_BASE_URL:?Set DEDICATED_PUBLIC_BASE_URL}
      LAB_TRACKER_AUTH_PUBLIC_VIEWER_REGISTRATION_ENABLED: "false"
      LAB_TRACKER_BOOTSTRAP_ADMIN_TOKEN_DISCLOSURE: never
      LAB_TRACKER_GRAPH_DRAFT_PROVIDER: openai
      LAB_TRACKER_OPENAI_API_KEY: ${DEDICATED_OPENAI_API_KEY:?Set DEDICATED_OPENAI_API_KEY in provider/.env}
      LAB_TRACKER_OPENAI_MODEL: ${DEDICATED_OPENAI_MODEL:?Set DEDICATED_OPENAI_MODEL}
      LAB_TRACKER_OPENAI_REASONING_EFFORT: ${DEDICATED_OPENAI_REASONING_EFFORT:?Set DEDICATED_OPENAI_REASONING_EFFORT}
      LAB_TRACKER_OPENAI_REASONING_MODE: ${DEDICATED_OPENAI_REASONING_MODE:?Set DEDICATED_OPENAI_REASONING_MODE}
      LAB_TRACKER_OPENAI_TIMEOUT_SECONDS: ${DEDICATED_OPENAI_TIMEOUT_SECONDS:?Set DEDICATED_OPENAI_TIMEOUT_SECONDS}
      LAB_TRACKER_GRAPH_DRAFT_SCHEDULER_ENABLED: "true"
    ports:
      - "127.0.0.1:${DEDICATED_HOST_PORT:?Set DEDICATED_HOST_PORT}:8000"
    volumes:
      - app_data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DEDICATED_POSTGRES_DB:?Set DEDICATED_POSTGRES_DB}
      POSTGRES_USER: ${DEDICATED_POSTGRES_USER:?Set DEDICATED_POSTGRES_USER}
      POSTGRES_PASSWORD: ${DEDICATED_POSTGRES_PASSWORD:?Set DEDICATED_POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  app_data:
  postgres_data:
