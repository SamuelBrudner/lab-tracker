name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - uses: astral-sh/setup-uv@v3
      - name: Install Python dependencies
        run: uv sync --frozen --extra test --extra lint
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint
        run: uv run ruff check .
      - name: Lint frontend
        run: npm run lint:frontend -- --quiet
      - name: Test frontend
        run: npm run test:frontend
      - name: Build frontend
        run: npm run build:frontend
      - name: Check frontend bundle is committed
        run: git diff --exit-code -- src/lab_tracker/frontend
      - name: Check skill API reference is current
        run: uv run python scripts/generate_lab_tracker_skill_reference.py --check
      - name: Test
        run: uv run pytest -q

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v3
      - name: Install Python dependencies
        run: uv sync --frozen --extra test
      - name: Test Postgres integration subset
        env:
          LAB_TRACKER_POSTGRES_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/postgres
        run: uv run pytest -q -m postgres
