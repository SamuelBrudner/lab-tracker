name: ci

on:
  push:
    branches: [main]
  pull_request:

# A PR branch push previously triggered both a `push` and a `pull_request` run
# of this workflow on the same commit, doubling the exposure to any flaky job.
# Restrict `push` to `main` so PR branches run exactly once (via pull_request),
# and cancel superseded in-progress runs when a ref is updated again.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Every setup-uv step pins the same exact uv release as the Dockerfile, so lock
# handling and `uv sync --frozen` behave identically in CI and in the image.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.18"
      # --frozen installs exactly what uv.lock records without validating it
      # against pyproject.toml; fail here when they have drifted.
      - name: Check uv.lock matches pyproject.toml
        run: uv lock --check
      - name: Install Python dependencies
        run: uv sync --frozen --extra test --extra lint
      - name: Install frontend dependencies
        run: npm ci
      - name: Audit frontend dependencies
        run: npm audit --audit-level=high
      - name: Lint
        run: uv run --frozen ruff check .
      - name: Typecheck Python architecture contracts
        run: uv run --frozen mypy
      - name: Lint frontend
        run: npm run lint:frontend -- --quiet
      - name: Check frontend OpenAPI declarations
        run: npm run check:frontend-contracts
      - name: Typecheck frontend API contracts
        run: npm run typecheck:frontend
      - name: Test frontend
        run: npm run test:frontend
      # Reruns the suite with React's effects deferred past Testing Library's
      # setTimeout(0) drain (src/lab_tracker/frontend_src/test/scheduler-chaos.js),
      # so a test that races them fails on its own PR instead of flaking later.
      - name: Test frontend under scheduler chaos
        run: npm run test:frontend:chaos
      - name: Build frontend
        run: npm run build:frontend
      - name: Check frontend bundle is committed
        run: git diff --exit-code -- src/lab_tracker/frontend
      - name: Check skill API reference is current
        run: uv run --frozen python scripts/generate_lab_tracker_skill_reference.py --check
      - name: Test
        run: uv run --frozen pytest -q

  python-minimum:
    name: Python 3.10 compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.18"
      # --frozen installs exactly what uv.lock records without validating it
      # against pyproject.toml; fail here when they have drifted.
      - name: Check uv.lock matches pyproject.toml
        run: uv lock --check
      - name: Install frozen Python dependencies
        run: uv sync --frozen --extra test
      - name: Test declared minimum Python
        run: uv run --frozen pytest -q

  unlocked-install:
    name: Install from declared dependency ranges
    # pip installs and `uv tool install` resolve the pyproject.toml ranges, not
    # uv.lock, so a release inside a declared range (for example an `mcp` minor)
    # can break them while every locked job stays green.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.18"
      - name: Install the project without the lockfile
        run: |
          uv venv "${RUNNER_TEMP}/unlocked"
          uv pip install --python "${RUNNER_TEMP}/unlocked/bin/python" .
      - name: Smoke-test the MCP server and CLI entry points
        working-directory: ${{ runner.temp }}
        run: |
          "${RUNNER_TEMP}/unlocked/bin/python" -c "import lab_tracker.mcp_server, lab_tracker.cli, lab_tracker_client.cli"
          test -x "${RUNNER_TEMP}/unlocked/bin/lt-mcp"

  docker-image:
    name: Docker image boots under compose
    # The Dockerfile, entrypoint, and compose files are otherwise only checked
    # as text, so a regression that shows when the image is built or started
    # (a missing runtime dependency, a failing migration, a broken entrypoint)
    # would reach Render and self-hosted deployments unnoticed.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Validate the dedicated-instance compose file
        env:
          DEDICATED_IMAGE: lab-tracker-dedicated:ci
        run: >-
          docker compose
          --project-directory deployments/dedicated-instance
          --env-file deployments/dedicated-instance/.env.example
          --env-file deployments/dedicated-instance/provider/.env.example
          -f deployments/dedicated-instance/docker-compose.yml
          config --quiet
      - name: Build the image and start the app with Postgres
        run: docker compose up --build --detach --wait --wait-timeout 300 app
      - name: Probe the running app
        run: |
          set -euo pipefail
          curl --fail --silent --show-error http://127.0.0.1:8000/health
          test "$(docker compose exec -T app id -u)" != "0"
          docker compose exec -T app sh -eu -c '
            LAB_TRACKER_AUTH_SECRET_KEY="$(cat /app/data/runtime-env/auth-secret-key)"
            export LAB_TRACKER_AUTH_SECRET_KEY
            exec python -m lab_tracker.deployment_probe \
              --expected-app-name lab-tracker \
              --expected-environment production \
              --expected-source-revision unknown \
              --alembic-config /app/alembic.ini
          '
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

  e2e:
    # Browser E2E in its own job so a browser download or a service-worker
    # timing flake never gates the fast unit/lint lane.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.18"
      # --frozen installs exactly what uv.lock records without validating it
      # against pyproject.toml; fail here when they have drifted.
      - name: Check uv.lock matches pyproject.toml
        run: uv lock --check
      - name: Install Python dependencies
        run: uv sync --frozen --extra test
      - name: Install frontend dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Build frontend
        run: npm run build:frontend
      - name: Run browser E2E suite
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.18"
      # --frozen installs exactly what uv.lock records without validating it
      # against pyproject.toml; fail here when they have drifted.
      - name: Check uv.lock matches pyproject.toml
        run: uv lock --check
      - name: Install Python dependencies
        run: uv sync --frozen --extra test
      - name: Test Postgres integration subset
        env:
          LAB_TRACKER_POSTGRES_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/postgres
        run: uv run --frozen pytest -q -m postgres

  linux-local-filesystem-mounts:
    name: Linux local filesystem mount authority
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.18"
      # --frozen installs exactly what uv.lock records without validating it
      # against pyproject.toml; fail here when they have drifted.
      - name: Check uv.lock matches pyproject.toml
        run: uv lock --check
      - name: Install frozen Python test dependencies
        run: uv sync --frozen --extra test
      - name: Test ordinary and bind mounts beneath one grant
        shell: bash
        run: |
          set -euo pipefail
          base="${RUNNER_TEMP}/lab-tracker-local-mounts"
          grant="${base}/grant"
          ordinary_mount="${grant}/ordinary"
          bind_mount="${grant}/bind"
          bind_source="${base}/bind-source"
          mkdir -p "${ordinary_mount}" "${bind_mount}" "${bind_source}"
          cleanup() {
            sudo umount "${bind_mount}" 2>/dev/null || true
            sudo umount "${ordinary_mount}" 2>/dev/null || true
          }
          trap cleanup EXIT INT TERM
          sudo mount -t tmpfs -o size=16m tmpfs "${ordinary_mount}"
          sudo chown "$(id -u):$(id -g)" "${ordinary_mount}"
          sudo mount --bind "${bind_source}" "${bind_mount}"
          export LAB_TRACKER_TEST_ORDINARY_MOUNT_ROOT="${ordinary_mount}"
          export LAB_TRACKER_TEST_BIND_MOUNT_ROOT="${bind_mount}"
          uv run --frozen pytest -q tests/test_posix_pre_follow_local_store_health_helper.py

  windows-containment:
    name: Windows containment and registered artifacts
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.18"
      # --frozen installs exactly what uv.lock records without validating it
      # against pyproject.toml; fail here when they have drifted.
      - name: Check uv.lock matches pyproject.toml
        run: uv lock --check
      - name: Install frozen Python dependencies
        run: uv sync --frozen --extra test --extra lint
      - name: Lint
        run: uv run --frozen ruff check .
      - name: Typecheck Python architecture contracts
        run: uv run --frozen mypy
      - name: Test bounded subprocess containment
        run: >-
          uv run --frozen pytest -q
          tests/test_bounded_subprocess.py
          tests/test_windows_job.py
      # This focused gate runs complete host-I/O control-plane modules. The
      # full Windows pytest suite remains owned by lab-tracker-n5kp.56.6.
      - name: Test Windows registered artifacts and store health
        run: >-
          uv run --frozen pytest -q
          tests/test_local_store_locator.py
          tests/test_registered_http_prefix.py
          tests/test_rclone_store_locator.py
          tests/test_rclone_remote_policy.py
          tests/test_rclone_store_health.py
          tests/test_git_store_locator.py
          tests/test_git_process.py
          tests/test_git_store_health.py
          tests/test_store_authority_registry.py
          tests/test_local_path_policy.py
          tests/test_local_filesystem_authority.py
          tests/test_local_filesystem_operations.py
          tests/test_local_store_health.py
          tests/test_windows_local_store_health_helper.py
          tests/test_outbound_http_deadline.py
          tests/test_outbound_http_policy.py
          tests/test_safe_http_client.py
          tests/test_artifact_resolution.py
          tests/test_actor_admission.py
          tests/test_store_health.py
          tests/test_http_store_health.py
          tests/test_store_health_queries.py
          tests/test_store_health_admission.py
          tests/test_context_queries_prepared_resolution.py
          tests/test_external_artifacts_routes.py
          tests/test_data_stores_routes.py
          tests/test_evidence_artifact_read_opacity.py

  windows-local-store-health:
    name: Windows handle-bound local store health (Python 3.10)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.18"
      # --frozen installs exactly what uv.lock records without validating it
      # against pyproject.toml; fail here when they have drifted.
      - name: Check uv.lock matches pyproject.toml
        run: uv lock --check
      - name: Install frozen Python test dependencies
        run: uv sync --frozen --extra test
      - name: Test handle-bound local store health
        run: >-
          uv run --frozen pytest -q
          tests/test_local_filesystem_authority.py
          tests/test_local_filesystem_operations.py
          tests/test_windows_local_store_health_helper.py
          tests/test_local_store_health.py
          tests/test_packaging.py::test_wheel_contains_and_runs_isolated_local_health_helper

  macos-local-store-health:
    name: macOS handle-bound local store health
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.18"
      # --frozen installs exactly what uv.lock records without validating it
      # against pyproject.toml; fail here when they have drifted.
      - name: Check uv.lock matches pyproject.toml
        run: uv lock --check
      - name: Install frozen Python test dependencies
        run: uv sync --frozen --extra test
      - name: Test O_SEARCH helper and wheel
        run: >-
          uv run --frozen pytest -q
          tests/test_local_filesystem_authority.py
          tests/test_local_filesystem_operations.py
          tests/test_local_store_health.py
          tests/test_posix_pre_follow_local_store_health_helper.py
          tests/test_packaging.py
