name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
      - uses: astral-sh/setup-uv@v7
      - name: Install Python dependencies
        run: uv sync --frozen --extra test --extra lint
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint
        run: uv run ruff check .
      - name: Typecheck Python architecture contracts
        run: uv run mypy
      - name: Lint frontend
        run: npm run lint:frontend -- --quiet
      - name: Check frontend OpenAPI declarations
        run: npm run check:frontend-contracts
      - name: Typecheck frontend API contracts
        run: npm run typecheck:frontend
      - name: Test frontend
        run: npm run test:frontend
      - name: Build frontend
        run: npm run build:frontend
      - name: Check frontend bundle is committed
        run: git diff --exit-code -- src/lab_tracker/frontend
      - name: Check skill API reference is current
        run: uv run python scripts/generate_lab_tracker_skill_reference.py --check
      - name: Test
        run: uv run pytest -q

  python-minimum:
    name: Python 3.10 compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@v7
      - name: Install frozen Python dependencies
        run: uv sync --frozen --extra test
      - name: Test declared minimum Python
        run: uv run pytest -q

  e2e:
    # Browser E2E in its own job so a browser download or a service-worker
    # timing flake never gates the fast unit/lint lane.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
      - uses: astral-sh/setup-uv@v7
      - name: Install Python dependencies
        run: uv sync --frozen --extra test
      - name: Install frontend dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Build frontend
        run: npm run build:frontend
      - name: Run browser E2E suite
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v7
      - name: Install Python dependencies
        run: uv sync --frozen --extra test
      - name: Test Postgres integration subset
        env:
          LAB_TRACKER_POSTGRES_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/postgres
        run: uv run pytest -q -m postgres

  windows-containment:
    name: Windows containment and local artifacts
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v7
      - name: Install frozen Python dependencies
        run: uv sync --frozen --extra test --extra lint
      - name: Lint
        run: uv run ruff check .
      - name: Typecheck Python architecture contracts
        run: uv run mypy
      - name: Test bounded subprocess containment
        run: >-
          uv run pytest -q
          tests/test_bounded_subprocess.py
          tests/test_windows_job.py
      # This focused gate runs complete artifact modules. The full Windows
      # pytest suite remains owned by lab-tracker-n5kp.56.6.
      - name: Test Windows local-artifact resolution
        run: >-
          uv run pytest -q
          tests/test_local_store_locator.py
          tests/test_local_path_policy.py
          tests/test_local_file_access.py
          tests/test_windows_local_file.py
          tests/test_artifact_resolution.py
          tests/test_context_queries_prepared_resolution.py
          tests/test_external_artifacts_routes.py
          tests/test_data_stores_routes.py
          tests/test_evidence_artifact_read_opacity.py
