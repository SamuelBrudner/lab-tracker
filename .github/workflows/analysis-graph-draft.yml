name: Analysis graph draft

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner label that can reach the Lab Tracker API.
        required: true
        default: self-hosted
        type: string
      project_id:
        description: Project ID for a new evidence note. Not needed when note_id is set.
        required: false
        type: string
      note_id:
        description: Existing evidence note ID to draft from.
        required: false
        type: string
      evidence_path:
        description: UTF-8 text or markdown analysis evidence file.
        required: false
        default: analysis-evidence.md
        type: string
      artifact_name:
        description: Optional Actions artifact containing the evidence file.
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      runner:
        required: false
        default: self-hosted
        type: string
      project_id:
        required: false
        type: string
      note_id:
        required: false
        type: string
      evidence_path:
        required: false
        default: analysis-evidence.md
        type: string
      artifact_name:
        required: false
        default: ""
        type: string
    secrets:
      LAB_TRACKER_BASE_URL:
        required: true
      LAB_TRACKER_TOKEN:
        required: false
      LAB_TRACKER_USERNAME:
        required: false
      LAB_TRACKER_PASSWORD:
        required: false

jobs:
  draft:
    runs-on: ${{ inputs.runner }}
    env:
      LAB_TRACKER_BASE_URL: ${{ secrets.LAB_TRACKER_BASE_URL }}
      LAB_TRACKER_TOKEN: ${{ secrets.LAB_TRACKER_TOKEN }}
      LAB_TRACKER_USERNAME: ${{ secrets.LAB_TRACKER_USERNAME }}
      LAB_TRACKER_PASSWORD: ${{ secrets.LAB_TRACKER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        if: ${{ inputs.artifact_name != '' }}
        with:
          name: ${{ inputs.artifact_name }}

      - name: Install Lab Tracker client dependencies
        run: python -m pip install -e .

      - name: Create reviewable graph draft
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ -n "${{ inputs.note_id }}" ]]; then
            args+=(--note-id "${{ inputs.note_id }}")
          else
            args+=(--project-id "${{ inputs.project_id }}")
            args+=(--evidence-file "${{ inputs.evidence_path }}")
          fi
          python scripts/create-analysis-graph-draft.py "${args[@]}"
