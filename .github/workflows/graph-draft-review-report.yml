name: Graph draft review report

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner label that can reach the Lab Tracker API.
        required: true
        default: self-hosted
        type: string
      project_id:
        description: Optional project ID to limit the report.
        required: false
        type: string
      output:
        description: HTML report path.
        required: false
        default: graph-draft-review.html
        type: string
  workflow_call:
    inputs:
      runner:
        required: false
        default: self-hosted
        type: string
      project_id:
        required: false
        type: string
      output:
        required: false
        default: graph-draft-review.html
        type: string
    secrets:
      LAB_TRACKER_BASE_URL:
        required: true
      LAB_TRACKER_TOKEN:
        required: false
      LAB_TRACKER_USERNAME:
        required: false
      LAB_TRACKER_PASSWORD:
        required: false
      LAB_TRACKER_OPENAI_API_KEY:
        required: false

jobs:
  report:
    runs-on: ${{ inputs.runner }}
    env:
      LAB_TRACKER_BASE_URL: ${{ secrets.LAB_TRACKER_BASE_URL }}
      LAB_TRACKER_TOKEN: ${{ secrets.LAB_TRACKER_TOKEN }}
      LAB_TRACKER_USERNAME: ${{ secrets.LAB_TRACKER_USERNAME }}
      LAB_TRACKER_PASSWORD: ${{ secrets.LAB_TRACKER_PASSWORD }}
      LAB_TRACKER_OPENAI_API_KEY: ${{ secrets.LAB_TRACKER_OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Lab Tracker client dependencies
        run: python -m pip install -e .

      - name: Generate graph draft review report
        shell: bash
        run: |
          set -euo pipefail
          args=(--output "${{ inputs.output }}")
          if [[ -n "${{ inputs.project_id }}" ]]; then
            args+=(--project-id "${{ inputs.project_id }}")
          fi
          python scripts/create-graph-draft-review-report.py "${args[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: graph-draft-review-report
          path: ${{ inputs.output }}
